name: Update rankings

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh ranking data
        env:
          RANKING_SOURCE_URL: ${{ secrets.RANKING_SOURCE_URL }}
        run: node scripts/update-rankings.js

      - name: Commit ranking refresh
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update ranking data"
          file_pattern: data/rankings.json
